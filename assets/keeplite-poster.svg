<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">KeepLite — ваш личный цифровой блокнот</title><desc id="desc">Промо-постер приложения KeepLite с интерфейсом заметок, папок и чек-листов.</desc>
<defs>
