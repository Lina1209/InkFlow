<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0a16"><meta name="description" content="KeepLite — личный цифровой блокнот Mirror- Studio."><title>KeepLite — Mirror- Studio</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<style>
:root{--bg:#0b0a16;--panel:#151326;--panel2:#1b1930;--line:#302b4b;--text:#f4f1ff;--muted:#a9a3c2;--violet:#9b7bff;--blue:#65b7ff;--pink:#e28bff;--gold:#f3c77b;--red:#ff718d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,#34265d88,transparent 38%),radial-gradient(ellipse at 100% 20%,#173b6380,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.top{position:sticky;top:0;z-index:4;background:#0b0a16ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 18px}.topin{max-width:1400px;margin:auto;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:205px;color:var(--text);text-decoration:none}.brand img{width:38px}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;text-transform:uppercase}.search{flex:1}.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--panel2);color:var(--text)}.btn:hover{border-color:var(--violet)}.primary{background:linear-gradient(120deg,#795be0,#4b7fc6);border:0;font-weight:650}.wrap{max-width:1400px;margin:auto;padding:24px 18px 60px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}.side{position:sticky;top:82px;align-self:start}.navtitle{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:10px}.nav{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:#9b7bff20;color:var(--text)}.nav.active{box-shadow:inset 3px 0 var(--violet)}.count{margin-left:auto;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.sidefoot{border-top:1px solid var(--line);padding:15px 10px;color:var(--muted);font-size:11px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 20px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--violet)}h1{font-size:clamp(26px,4vw,35px);margin:4px 0 0;letter-spacing:-1px}.quick{background:linear-gradient(130deg,#211b3a,#17263a);border:1px solid #50417b;border-radius:17px;padding:16px;margin-bottom:20px}.quick textarea{width:100%;border:0;background:transparent;color:var(--text);resize:vertical;min-height:45px}.quickfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;position:relative;min-height:130px;overflow:hidden;cursor:pointer}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--violet))}.card:hover{border-color:#67539b;transform:translateY(-1px)}.card h3{margin:0 58px 8px 0;font-size:16px;overflow-wrap:anywhere}.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d0cbe0;max-height:170px;overflow:hidden}.cardtools{position:absolute;right:8px;top:8px;display:flex}.mini{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:7px}.mini:hover{background:#ffffff14;color:white}.meta{font-size:11px;color:var(--muted);margin-top:13px}.tag{display:inline-block;background:#9b7bff22;color:#d2c5ff;border-radius:30px;padding:3px 8px;margin:8px 4px 0 0;font-size:11px}.check{display:flex;gap:8px;font-size:13px;color:#d5d0e5;margin:5px 0}.check input{accent-color:var(--violet)}.empty{border:1px dashed var(--line);border-radius:16px;padding:55px 18px;text-align:center;color:var(--muted)}.empty strong{color:var(--text)}.overlay{display:none;position:fixed;inset:0;background:#05040bdd;z-index:10;align-items:center;justify-content:center;padding:14px}.overlay.open{display:flex}.dialog{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #514571;border-radius:18px;padding:20px}.dhead,.dfoot{display:flex;justify-content:space-between;align-items:center;gap:10px}.dhead h2{margin:0}.field{display:block;margin:13px 0}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select,.checkedit input[type=text]{width:100%;background:#0e0d1a;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text)}.field textarea{min-height:170px;resize:vertical}.tools{display:flex;gap:8px;flex-wrap:wrap}.checkedit{display:flex;gap:8px;margin:7px 0}.checkedit input[type=text]{flex:1;min-width:0}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#29213f;border:1px solid #66559a;padding:10px 15px;border-radius:12px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:16px 12px 45px}.side{position:static;display:flex;overflow:auto;gap:5px}.navtitle,.sidefoot{display:none}.nav{white-space:nowrap;width:auto;background:#151326aa}.topin{flex-wrap:wrap}.brand{min-width:0}.brand small{display:none}.search{order:3;flex-basis:100%}.actions{margin-left:auto}.head{align-items:start;flex-direction:column}}@media(max-width:480px){.top{padding:10px}.brand b{font-size:16px}.actions .btn{font-size:12px;padding:8px}.grid{grid-template-columns:1fr}.dialog{padding:15px}}
</style></head><body>
<header class="top"><div class="topin"><a class="brand" href="./"><img src="./icon.svg" alt=""><span><b>KeepLite</b><small>Mirror- Studio · личный блокнот</small></span></a><label class="search"><input id="search" type="search" placeholder="Поиск по заметкам, тегам и спискам…"></label><div class="actions"><button class="btn" id="backup">⇩ Копия</button><button class="btn" id="txtExport">TXT</button><button class="btn" id="import">⇧ Импорт</button><input id="file" type="file" accept=".json,application/json" hidden><button class="btn primary" id="new">＋ Новая</button></div></div></header>
<div class="wrap"><aside class="side"><div class="navtitle">Библиотека</div><button class="nav active" data-view="all">✧ Все заметки <span class="count" id="count">0</span></button><button class="nav" data-view="pinned">☆ Закреплённые</button><button class="nav" data-view="lists">☑ Чек-листы</button><button class="nav" data-view="archive">▣ Архив</button><button class="nav" data-view="trash">♲ Корзина</button><div class="navtitle">Папки</div><div id="folders"></div><button class="nav" id="addFolder">＋ Новая папка</button><div class="sidefoot">Записи хранятся на этом устройстве.<br><span id="status">● Подготовка хранилища…</span></div></aside>
<main><div class="head"><div><div class="eyebrow">Ваше пространство идей</div><h1 id="heading">Все заметки</h1></div><select class="btn" id="sort" aria-label="Сортировка"><option value="updated">Сначала изменённые</option><option value="created">Сначала новые</option><option value="az">По названию</option></select></div>
<section class="quick"><textarea id="quickText" rows="1" placeholder="Запишите мысль или напоминание…"></textarea><div class="quickfoot"><span class="hint">Быстрая запись · Enter — сохранить</span><button class="btn primary" id="quickSave">Сохранить ↗</button></div></section>
<div class="grid" id="grid"></div><div class="empty" id="empty" hidden><div style="font-size:38px">✧</div><strong>Здесь пока свободно</strong><p>Создайте первую заметку — и она останется под рукой.</p><button class="btn primary" id="emptyNew">Создать заметку</button></div></main></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><div class="dhead"><h2 id="dialogTitle">Новая заметка</h2><button class="btn" id="close" aria-label="Закрыть">×</button></div><label class="field"><span>Заголовок</span><input id="title" maxlength="180" placeholder="Название заметки"></label><label class="field"><span>Текст</span><textarea id="body" placeholder="Начните писать…"></textarea></label><div class="tools"><button class="btn" id="toggleChecks">☑ Чек-лист</button><select class="btn" id="folder"><option value="">Без папки</option></select><select class="btn" id="color"><option value="purple">Сиреневый</option><option value="blue">Голубой</option><option value="pink">Розовый</option><option value="gold">Золотой</option><option value="plain">Без акцента</option></select></div><div id="checkArea" hidden><div id="checkRows"></div><div class="checkedit"><input id="checkText" type="text" placeholder="Новый пункт…"><button class="btn" id="addCheck">＋</button></div></div><label class="field"><span>Теги через запятую</span><input id="tags" placeholder="идеи, работа, личное"></label><div class="dfoot"><button class="btn" id="delete" hidden style="color:var(--red)">В корзину</button><div><button class="btn primary" id="save">Сохранить</button></div></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), DB='keeplite-db', STORE='workspace', palette={purple:'#9b7bff',blue:'#65b7ff',pink:'#e28bff',gold:'#f3c77b',plain:'#51496a'};
let db=null,state={notes:[],folders:[],settings:{sort:'updated'}},view='all',folderFilter='',editing=null,checks=[],timer;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),date=()=>new Date().toISOString();
function say(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function normal(n){return{id:String(n.id||uid()),title:String(n.title||''),body:String(n.body||''),color:palette[n.color]?n.color:'purple',tags:Array.isArray(n.tags)?n.tags.map(String):[],folderId:n.folderId||'',checks:(n.checks||n.checklist||[]).map(c=>({text:String(c.text||''),done:!!c.done})),pinned:!!n.pinned,archived:!!n.archived,deletedAt:n.deletedAt||null,createdAt:n.createdAt||date(),updatedAt:n.updatedAt||date()}}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function read(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).get('state');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function write(){return new Promise((ok,no)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'state');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function saveState(){if(db)await write();else localStorage.setItem('keeplite-state',JSON.stringify(state));$('status').textContent='● Изменения сохранены'}
async function init(){try{db=await openDB();let old=await read();if(old?.notes)state={notes:old.notes.map(normal),folders:old.folders||[],settings:old.settings||{sort:'updated'}};else{let legacy=[];try{legacy=JSON.parse(localStorage.getItem('keeplite_notes')||'[]')}catch(e){say('Старые данные повреждены — не удалены')}if(Array.isArray(legacy)&&legacy.length){state.notes=legacy.map(normal);await write();say('Старые заметки перенесены')}else await write()}$('status').textContent='● Локальная база IndexedDB'}catch(e){$('status').textContent='● Резервный режим браузера';try{state=JSON.parse(localStorage.getItem('keeplite-state')||'null')||state}catch(_){}}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
function list(){let a=state.notes.filter(n=>view==='trash'?n.deletedAt:!n.deletedAt);if(view==='all')a=a.filter(n=>!n.archived);if(view==='pinned')a=a.filter(n=>n.pinned&&!n.archived);if(view==='lists')a=a.filter(n=>n.checks.length&&!n.archived);if(view==='archive')a=a.filter(n=>n.archived);if(folderFilter)a=a.filter(n=>n.folderId===folderFilter);let q=$('search').value.trim().toLocaleLowerCase('ru');if(q)a=a.filter(n=>(n.title+' '+n.body+' '+n.tags.join(' ')+' '+n.checks.map(c=>c.text).join(' ')).toLocaleLowerCase('ru').includes(q));let s=$('sort').value;if(s==='az')a.sort((x,y)=>x.title.localeCompare(y.title,'ru'));else a.sort((x,y)=>new Date(y[s==='created'?'createdAt':'updatedAt'])-new Date(x[s==='created'?'createdAt':'updatedAt']));return a}
function renderFolders(){let nav=$('folders'),sel=$('folder'),v=sel.value;nav.replaceChildren();sel.replaceChildren(new Option('Без папки',''));state.folders.forEach(f=>{let b=document.createElement('button');b.className='nav'+(folderFilter===f.id?' active':'');let d=document.createElement('i');d.className='dot';let t=document.createElement('span');t.textContent=f.name;b.append(d,t);b.onclick=()=>{folderFilter=f.id;view='all';render()};nav.append(b);sel.add(new Option(f.name,f.id))});sel.value=v}
function render(){let names={all:'Все заметки',pinned:'Закреплённые',lists:'Чек-листы',archive:'Архив',trash:'Корзина'};$('heading').textContent=folderFilter?(state.folders.find(f=>f.id===folderFilter)?.name||'Папка'):names[view];$('count').textContent=state.notes.filter(n=>!n.archived&&!n.deletedAt).length;$('sort').value=state.settings.sort||'updated';renderFolders();let g=$('grid');g.replaceChildren();let a=list();a.forEach(n=>g.append(card(n)));$('empty').hidden=!!a.length;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view&&!folderFilter))}
function card(n){let c=document.createElement('article');c.className='card';c.style.setProperty('--accent',palette[n.color]);let tools=document.createElement('div');tools.className='cardtools';function act(label,title,fn){let b=document.createElement('button');b.className='mini';b.textContent=label;b.title=title;b.onclick=e=>{e.stopPropagation();fn()};tools.append(b)}if(n.deletedAt){act('↶','Восстановить',()=>change(n.id,x=>x.deletedAt=null));act('×','Удалить навсегда',()=>purge(n.id))}else{act(n.pinned?'★':'☆','Закрепить',()=>change(n.id,x=>x.pinned=!x.pinned));act(n.archived?'↩':'▣','Архив',()=>change(n.id,x=>x.archived=!x.archived))}c.append(tools);let h=document.createElement('h3');h.textContent=n.title||'Без названия';c.append(h);if(n.body){let p=document.createElement('p');p.textContent=n.body;c.append(p)}n.checks.slice(0,5).forEach((x,i)=>{let l=document.createElement('label');l.className='check';let b=document.createElement('input');b.type='checkbox';b.checked=x.done;b.onclick=e=>e.stopPropagation();b.onchange=()=>change(n.id,z=>z.checks[i].done=b.checked);let t=document.createElement('span');t.textContent=x.text;l.append(b,t);c.append(l)});n.tags.forEach(t=>{let s=document.createElement('span');s.className='tag';s.textContent='#'+t;c.append(s)});let m=document.createElement('div');m.className='meta';m.textContent=new Date(n.updatedAt).toLocaleString('ru');c.append(m);c.onclick=()=>edit(n.id);return c}
async function change(id,fn){let n=state.notes.find(x=>x.id===id);if(!n)return;fn(n);n.updatedAt=date();await saveState();render()}
async function purge(id){if(!confirm('Удалить навсегда?'))return;state.notes=state.notes.filter(n=>n.id!==id);await saveState();render();say('Удалено')}
function edit(id=null){editing=id;let n=state.notes.find(x=>x.id===id);checks=n?n.checks.map(x=>({...x})):[];$('dialogTitle').textContent=n?'Редактировать заметку':'Новая заметка';$('title').value=n?.title||'';$('body').value=n?.body||'';$('tags').value=n?.tags.join(', ')||'';$('folder').value=n?.folderId||'';$('color').value=n?.color||'purple';$('delete').hidden=!n;$('checkArea').hidden=!checks.length;$('toggleChecks').textContent=checks.length?'Скрыть чек-лист':'☑ Чек-лист';drawChecks();$('overlay').classList.add('open');$('title').focus()}
function drawChecks(){let box=$('checkRows');box.replaceChildren();checks.forEach((x,i)=>{let r=document.createElement('div');r.className='checkedit';let cb=document.createElement('input');cb.type='checkbox';cb.checked=x.done;cb.onchange=()=>x.done=cb.checked;let t=document.createElement('input');t.type='text';t.value=x.text;t.oninput=()=>x.text=t.value;let d=document.createElement('button');d.className='btn';d.textContent='×';d.onclick=()=>{checks.splice(i,1);drawChecks()};r.append(cb,t,d);box.append(r)})}
function close(){ $('overlay').classList.remove('open');editing=null}
async function commit(){let title=$('title').value.trim(),body=$('body').value.trim(),items=checks.filter(x=>x.text.trim());if(!title&&!body&&!items.length){say('Добавьте текст или пункт списка');return}let old=state.notes.find(x=>x.id===editing),n=normal({...old,id:old?.id||uid(),title,body,color:$('color').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),folderId:$('folder').value,checks:items,createdAt:old?.createdAt||date(),updatedAt:date()});if(old)state.notes=state.notes.map(x=>x.id===old.id?n:x);else state.notes.unshift(n);await saveState();close();render();say('Заметка сохранена')}
async function quickSave(){let body=$('quickText').value.trim();if(!body)return;state.notes.unshift(normal({id:uid(),body}));$('quickText').value='';await saveState();render();say('Запись сохранена')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('keeplite-backup-'+date().slice(0,10)+'.json',JSON.stringify({format:'keeplite-backup',version:1,exportedAt:date(),state},null,2),'application/json');say('Резервная копия готова')}\nfunction exportText(){const text=state.notes.filter(n=>!n.deletedAt).map(n=>'# '+(n.title||'Без названия')+'\\n'+n.body+(n.checks.length?'\\n'+n.checks.map(c=>(c.done?'[x] ':'[ ] ')+c.text).join('\\n'):'')+'\\n'+n.tags.map(t=>'#'+t).join(' ')+'\\n').join('\\n---\\n\\n');download('keeplite-notes.txt',text,'text/plain;charset=utf-8')}
async function importFile(f){if(f.size>20*1024*1024){say('Файл больше 20 МБ');return}try{let d=JSON.parse(await f.text()),s=d.state||d;if(!Array.isArray(s.notes))throw Error('Не найден список заметок');if(!confirm('Импорт заменит текущие данные. Продолжить?'))return;state={notes:s.notes.map(normal),folders:Array.isArray(s.folders)?s.folders:[],settings:s.settings||{sort:'updated'}};await saveState();render();say('Резервная копия восстановлена')}catch(e){say('Ошибка импорта: '+e.message)}$('file').value=''}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;folderFilter='';render()});$('search').oninput=render;$('sort').onchange=()=>{state.settings.sort=$('sort').value;saveState();render()};$('new').onclick=$('emptyNew').onclick=()=>edit();$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('save').onclick=commit;$('delete').onclick=async()=>{let n=state.notes.find(x=>x.id===editing);if(n){n.deletedAt=date();n.pinned=false;await saveState();close();render();say('В корзине')}};$('toggleChecks').onclick=()=>{$('checkArea').hidden=!$('checkArea').hidden;if(!checks.length)checks.push({text:'',done:false});$('toggleChecks').textContent=$('checkArea').hidden?'☑ Чек-лист':'Скрыть чек-лист';drawChecks()};$('addCheck').onclick=()=>{let t=$('checkText').value.trim();if(t){checks.push({text:t,done:false});$('checkText').value='';drawChecks()}};$('checkText').onkeydown=e=>{if(e.key==='Enter')$('addCheck').click()};$('quickSave').onclick=quickSave;$('quickText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();quickSave()}};$('backup').onclick=backup;$('txtExport').onclick=exportText;$('import').onclick=()=>$('file').click();$('file').onchange=()=>{if($('file').files[0])importFile($('file').files[0])};$('addFolder').onclick=async()=>{let name=prompt('Название папки');if(name?.trim()){state.folders.push({id:uid(),name:name.trim().slice(0,60)});await saveState();render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){edit();e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){$('search').focus();e.preventDefault()}})}
bind();init();
</script></body></html>
